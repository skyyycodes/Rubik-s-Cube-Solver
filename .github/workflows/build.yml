name: Build Executables

on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: RubiksCubeSolver-Windows
            artifact_path: dist/RubiksCubeSolver.exe
          - os: macos-latest
            artifact_name: RubiksCubeSolver-macOS
            artifact_path: dist/RubiksCubeSolver.app.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy matplotlib cffi pyinstaller

      - name: Install local kociemba package
        run: pip install ./kociemba

      - name: Build with PyInstaller
        run: pyinstaller RubiksCubeSolver.spec --noconfirm

      - name: Zip .app bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist
          zip -r -y RubiksCubeSolver.app.zip RubiksCubeSolver.app
          rm -rf RubiksCubeSolver.app

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

      - name: Attach to release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_path }}
